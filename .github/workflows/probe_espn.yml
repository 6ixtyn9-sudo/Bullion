# Live ESPN probe workflow for Bullion.
#
# Purpose: capture REAL live ESPN payload facts for all lanes (NHL, NFL, CFB,
# Top-6 soccer, and US basketball: NBA, NCAA M, NCAA W, WNBA), then commit them
# so parsers and lane permissions are backed by evidence instead of assumptions.
# Subset runs (e.g. `leagues: basketball`) merge into espn_probe_latest.json
# without erasing other lanes' captured coverage.
#
# Scheduled Mon/Thu at 07:00 SAST (05:00 UTC) so per-league probe evidence
# stays inside PROBE_MAX_AGE_HOURS (168h / 7 days).
#
# Deliberately NOT here: any claim that a route resolving means a market is
# priced. A window with no upcoming fixture reports status "no_pre_match_events"
# and leaves that lane in research_only.

name: probe-espn

on:
  schedule:
    - cron: "0 5 * * 1,4"   # Mon & Thu 07:00 SAST (05:00 UTC)
  workflow_dispatch:
    inputs:
      date:
        description: "First SAST day to probe (YYYY-MM-DD). Empty = today."
        required: false
        default: ""
      days_ahead:
        description: "How many extra SAST days to probe after that day."
        required: false
        default: "2"
      leagues:
        description: "Lane keys comma list, 'soccer', 'basketball', or 'all'."
        required: false
        default: "all"
      season:
        description: "Season year for the backfill index probe. Empty = current UTC year."
        required: false
        default: ""

permissions:
  contents: write

# Shared with bullion-daily: both jobs commit to main, so they must not overlap.
concurrency:
  group: bullion-commits
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (no runtime dependencies)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Run live ESPN probe
        env:
          PROBE_DATE: ${{ inputs.date }}
          PROBE_DAYS: ${{ inputs.days_ahead || '2' }}
          PROBE_LEAGUES: ${{ inputs.leagues || 'all' }}
          PROBE_SEASON: ${{ inputs.season }}
        run: |
          mkdir -p localdata/_probes
          ARGS=(--days-ahead "${PROBE_DAYS:-2}" --leagues "${PROBE_LEAGUES:-all}")
          ARGS+=(--summary-samples 8 --predictor-samples 3)
          if [ -n "${PROBE_DATE}" ]; then ARGS+=(--date "${PROBE_DATE}"); fi
          if [ -n "${PROBE_SEASON}" ]; then ARGS+=(--season "${PROBE_SEASON}"); fi
          python3 scripts/probe_espn.py \
            --out localdata/_probes/espn_probe_latest.json \
            "${ARGS[@]}"

      - name: Show coverage summary
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open("localdata/_probes/espn_probe_latest.json"))
          print("captured_utc:", report.get("captured_utc"))
          print("sast_days:   ", report.get("sast_days") or report.get("sast_day"))
          if report.get("probed_lanes"):
              print("probed_lanes:", report.get("probed_lanes"))
          if report.get("carried_over_lanes"):
              print("carried_over:", report.get("carried_over_lanes"),
                    "from", report.get("carried_over_from_utc"))
          print()
          for key, entry in report["leagues"].items():
              parts = []
              for market, stats in entry["coverage"]["named_book_pre_tip"].items():
                  pct = stats.get("event_coverage")
                  shown = "n/a" if pct is None else format(pct, ".2f")
                  parts.append(market + "=" + shown + " (" + str(stats.get("status")) + ")")
              print(key.ljust(16),
                    "events=" + str(entry["events"]),
                    "pre=" + str(entry["pre_events"]),
                    "offers=" + str(entry["odds_offers"]),
                    "books=" + str(len(entry["books"])))
              print(" " * 16, " ".join(parts))
              fp = entry["summary"]["field_presence"]
              if fp:
                  print(" " * 16,
                        "summaries pickcenter=" + str(sum(1 for row in fp if row["has_pickcenter"])),
                        "predictor=" + str(sum(1 for row in fp if row["has_predictor"])),
                        "| predictor attempts=" + str(entry["predictor"]["attempts"]))
          print()
          print("backfill:", {
              f"{k}({v.get('season')})": v.get("count")
              for k, v in report.get("backfill", {}).items()
          })
          print()
          print("A percentage only means something when status is 'ok' and pre >= 3.")
          print("status 'no_pre_match_events' means: re-probe with a fixture window.")
          PY

      - name: Commit probe evidence
        run: |
          git config user.name "bullion-bot"
          git config user.email "bullion-bot@users.noreply.github.com"
          git add localdata/_probes/espn_probe_latest.json
          if git diff --cached --quiet; then
            echo "No probe changes to commit."
            exit 0
          fi
          git commit -m "probe: live ESPN evidence $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              pushed=1
              break
            fi
            echo "push rejected; rebasing and retrying (attempt ${attempt})"
            sleep 10
          done
          if [ "${pushed}" -ne 1 ]; then
            echo "::error::probe push failed after 3 attempts"
            exit 1
          fi

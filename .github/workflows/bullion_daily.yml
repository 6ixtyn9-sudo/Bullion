# Reliable external-trigger workflow for Bullion (mirrors Ma_Golide_Satellites).
# GitHub Actions `schedule:` cron is deliberately disabled because GitHub delays
# or silently drops scheduled ticks. Instead, an external scheduler posts a
# `repository_dispatch` event with `event_type: "bullion-scheduled-tick"`.
#
# External scheduler (cron-job.org, Africa/Johannesburg SAST = UTC+2):
#   00:15 SAST (22:15Z) -> basketball prime ET slate (18:30-19:15 EST / 19:30-20:15 EDT)
#   01:15 SAST (23:15Z) -> basketball late ET slate (19:30-20:15 EST / 20:30-21:15 EDT)
#   08:15 SAST (06:15Z) -> overnight US finals refresh + grading
#   12:15 SAST (10:15Z) -> after 12:00 SAST Top-6 Soccer cutoff
#   16:15 SAST (14:15Z) -> after 16:00 SAST NFL/CFB/NHL cutoff
#   17:15 SAST (15:15Z) -> basketball noon ET matinees (12:00 EST / 13:00 EDT)
#   19:15 SAST (17:15Z) -> weekend 13:00-14:30 EST matinees (closes 20:00 SAST drop window)
#   21:15 SAST (19:15Z) -> weekend 15:00-16:30 EST matinees + early basketball D+1 pre-cutoff
#   23:15 SAST (21:15Z) -> EU soccer grading + basketball D+1 early ET (17:00-18:15 EST)
# (Runs are idempotent and write-once at cutoff.)

name: bullion-daily

on:
  repository_dispatch:
    types: [bullion-scheduled-tick]
  workflow_dispatch:
    inputs:
      league:
        description: "Lane key (or comma list), 'soccer', 'basketball', or 'all'."
        required: false
        default: "all"
      date:
        description: "SAST day (YYYY-MM-DD). Empty = today."
        required: false
        default: ""
      as_of:
        description: "Decision-time UTC override (YYYY-MM-DDTHH:MM:SSZ). Empty = now."
        required: false
        default: ""

permissions:
  contents: write

# Shared with probe-espn: both jobs commit to main, so they must not overlap.
concurrency:
  group: bullion-commits
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore SQLite warehouse
        uses: actions/cache/restore@v4
        with:
          path: localdata/bullion.db
          key: bullion-db-v1-${{ github.run_id }}
          restore-keys: |
            bullion-db-v1-

      - name: Install project (no runtime dependencies)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Probe evidence status
        env:
          AS_OF: ${{ github.event.client_payload.as_of || inputs.as_of }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          from bullion.espn import lane_permission
          from bullion.models import LEAGUES, now_utc

          path = pathlib.Path("localdata/_probes/espn_probe_latest.json")
          if not path.exists():
              print("::warning::no committed probe report: every lane is research_only")
              raise SystemExit(0)
          report = json.loads(path.read_text())
          as_of = os.environ.get("AS_OF") or now_utc()
          print("probe captured:", report.get("captured_utc"),
                "| as_of:", as_of,
                "| window:", report.get("sast_days") or report.get("sast_day"))
          for key, league in LEAGUES.items():
              permission = lane_permission(report, league, as_of_utc=as_of)
              mode = "research_only" if permission.research_only else "tickets"
              markets = ",".join(sorted(permission.ticket_markets)) or "-"
              print(key.ljust(16), mode.ljust(14), permission.reason,
                    "captured=" + (permission.captured_utc or "-"),
                    "markets=" + markets)
          PY

      - name: Bounded backfill (only when the warehouse is cold)
        id: cold_backfill
        env:
          LEAGUE: ${{ github.event.client_payload.league || inputs.league }}
        run: |
          if [ -f localdata/bullion.db ]; then
            echo "Warehouse restored from cache; skipping backfill."
            echo "ran=false" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/backfill.py \
              --league "${LEAGUE:-all}" \
              --seasons 2024,2025,2026 \
              --max-events 250 \
              --max-seconds 1200
            echo "ran=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Basketball scoreboard backfill (cold lanes only)
        id: bball_backfill
        env:
          LEAGUE: ${{ github.event.client_payload.league || inputs.league }}
        run: |
          LANES=$(LEAGUE="${LEAGUE:-all}" python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          from bullion.models import BASKETBALL_LEAGUES
          from bullion.runner import select_leagues
          from bullion.store import Store

          requested = {
              league.key
              for league in select_leagues(os.environ.get("LEAGUE") or "all")
              if league.key in BASKETBALL_LEAGUES
          }
          if not requested:
              raise SystemExit(0)

          spec = importlib.util.spec_from_file_location("bullion_backfill", "scripts/backfill.py")
          backfill = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(backfill)
          db = Path("localdata/bullion.db")
          db.parent.mkdir(parents=True, exist_ok=True)
          with Store(db) as store:
              cold = backfill.cold_lanes(store, min_finals=50)
          print(",".join(key for key in BASKETBALL_LEAGUES if key in requested and key in cold))
          PY
          )
          if [ -z "${LANES}" ]; then
            echo "all requested basketball lanes are warm or fully swept; nothing to backfill"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "cold basketball lanes: ${LANES}"
          python3 scripts/backfill.py --league "${LANES}" --days-back 400 --max-seconds 600
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Warehouse integrity gate (post-backfill)
        if: always() && (steps.cold_backfill.outputs.ran == 'true' || steps.bball_backfill.outputs.ran == 'true')
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, sqlite3
          p = pathlib.Path("localdata/bullion.db")
          if not p.exists():
              print("no warehouse present; nothing to gate")
              raise SystemExit(0)
          try:
              con = sqlite3.connect(f"file:{p}?mode=ro", uri=True)
              ok = con.execute("PRAGMA quick_check").fetchone()[0]
              con.close()
          except sqlite3.DatabaseError as exc:
              ok = f"unopenable: {exc}"
          print("quick_check:", ok)
          if ok != "ok":
              shutil.move(str(p), f"/tmp/bullion.db.corrupt-{os.environ.get('GITHUB_RUN_ID', 'unknown')}")
              print("::warning::corrupt warehouse quarantined to /tmp; next run cold-rebuilds")
          raise SystemExit(0)
          PY

      - name: Save warehouse checkpoint (post-backfill, cold runs only)
        if: always() && (steps.cold_backfill.outputs.ran == 'true' || steps.bball_backfill.outputs.ran == 'true') && hashFiles('localdata/bullion.db') != ''
        uses: actions/cache/save@v4
        with:
          path: localdata/bullion.db
          key: bullion-db-v1-${{ github.run_id }}-backfill

      - name: Run daily lanes
        env:
          LEAGUE: ${{ github.event.client_payload.league || inputs.league }}
          DAY: ${{ github.event.client_payload.date || inputs.date }}
          AS_OF: ${{ github.event.client_payload.as_of || inputs.as_of }}
        run: |
          ARGS=(--league "${LEAGUE:-all}" --max-seconds 2400)
          if [ -n "${DAY}" ]; then ARGS+=(--date "${DAY}"); fi
          if [ -n "${AS_OF}" ]; then ARGS+=(--as-of "${AS_OF}"); fi
          python3 scripts/daily.py "${ARGS[@]}"

      - name: Run basketball lanes for the next SAST day
        if: ${{ (github.event.client_payload.date || inputs.date) == '' }}
        env:
          LEAGUE: ${{ github.event.client_payload.league || inputs.league }}
          AS_OF: ${{ github.event.client_payload.as_of || inputs.as_of }}
        run: |
          # Early ET evening tips (17:00-18:15 EST / 18:00-19:15 EDT) fall on
          # the NEXT SAST day (00:00-01:15 SAST D+1) while their tip-120m cutoff
          # (20:00Z-21:15Z) falls BEFORE SAST midnight (22:00Z). Only run D+1 in
          # that pre-midnight SAST window; at 22:15Z/23:15Z SAST_TODAY is already
          # D+1 so "Run daily lanes" already covered it.
          BASKETBALL_LANES=$(LEAGUE="${LEAGUE:-all}" python3 - <<'PY'
          import os
          from bullion.models import BASKETBALL_LEAGUES
          from bullion.runner import select_leagues

          keys = [
              league.key
              for league in select_leagues(os.environ.get("LEAGUE") or "all")
              if league.key in BASKETBALL_LEAGUES
          ]
          print(",".join(keys))
          PY
          )
          if [ -z "${BASKETBALL_LANES}" ]; then
            echo "selector ${LEAGUE:-all}: no basketball lanes requested"
            exit 0
          fi
          TARGET=$(AS_OF="${AS_OF:-}" python3 - <<'PY'
          import os
          from datetime import timedelta
          from bullion.models import now_utc, parse_utc, sast_day

          ref = parse_utc(os.environ["AS_OF"]) if os.environ.get("AS_OF") else parse_utc(now_utc())
          sast_today = sast_day(ref)
          utc_tomorrow = (ref + timedelta(days=1)).strftime("%Y-%m-%d")
          if ref.hour >= 18 and utc_tomorrow != sast_today:
              print(utc_tomorrow)
          PY
          )
          if [ -z "${TARGET}" ]; then
            echo "outside pre-midnight SAST next-day window; skipping duplicate next-day run"
            exit 0
          fi
          ARGS=(--league "${BASKETBALL_LANES}" --date "${TARGET}" --max-seconds 1200)
          if [ -n "${AS_OF}" ]; then ARGS+=(--as-of "${AS_OF}"); fi
          python3 scripts/daily.py "${ARGS[@]}"

      - name: Show cards
        run: |
          shopt -s nullglob
          for card in localdata/*/auto_tickets_????-??-??.txt localdata/*/auto_tickets_performance.txt; do
            echo "=== ${card} ==="
            cat "${card}"
          done

      - name: Replay parity gate (exits 1 on a frozen-price mismatch)
        run: python3 scripts/replay_harness.py --parity

      - name: Warehouse integrity gate (final)
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, sqlite3
          p = pathlib.Path("localdata/bullion.db")
          if not p.exists():
              print("no warehouse present; nothing to gate")
              raise SystemExit(0)
          try:
              con = sqlite3.connect(f"file:{p}?mode=ro", uri=True)
              ok = con.execute("PRAGMA quick_check").fetchone()[0]
              con.close()
          except sqlite3.DatabaseError as exc:
              ok = f"unopenable: {exc}"
          print("quick_check:", ok)
          if ok != "ok":
              shutil.move(str(p), f"/tmp/bullion.db.corrupt-{os.environ.get('GITHUB_RUN_ID', 'unknown')}")
              print("::warning::corrupt warehouse quarantined to /tmp; next run cold-rebuilds")
          raise SystemExit(0)
          PY

      - name: Save warehouse (final)
        if: always() && hashFiles('localdata/bullion.db') != ''
        uses: actions/cache/save@v4
        with:
          path: localdata/bullion.db
          key: bullion-db-v1-${{ github.run_id }}

      - name: Commit localdata artifacts (never the SQLite warehouse)
        run: |
          git config user.name "bullion-bot"
          git config user.email "bullion-bot@users.noreply.github.com"
          git add localdata
          if git diff --cached --quiet; then
            echo "No localdata changes to commit."
            exit 0
          fi
          git commit -m "localdata: daily paper run $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              pushed=1
              break
            fi
            echo "push rejected; rebasing and retrying (attempt ${attempt})"
            sleep 10
          done
          if [ "${pushed}" -ne 1 ]; then
            echo "::error::localdata push failed after 3 attempts"
            exit 1
          fi

[project]
name = "bullion"
version = "0.1.0"
description = "Lean 3-sport ESPN-native quantitative paper-ticket engine (NHL, NFL/CFB, Soccer)"
requires-python = ">=3.11"
# Deliberately zero runtime dependencies: stdlib sqlite3 + urllib only.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# COPY THIS FILE TO .github/workflows/bullion_daily.yml
#
# Arena's GitHub App token cannot push workflow files, so this file lives here
# for you to paste into `.github/workflows/bullion_daily.yml` on GitHub.
#
# DO NOT enable this until `.github/workflows/probe_espn.yml` has run and its
# report has been inspected. Without a committed probe report every lane stays
# research_only and freezes no ticket (the runner is deliberately fail-closed).
#
# Cron times are UTC. SAST = UTC+2.
#   09:45Z = 11:45 SAST  -> before the 12:00 SAST soccer cutoff
#   14:15Z = 16:15 SAST  -> after the 16:00 SAST US cutoffs
#   06:15Z = 08:15 SAST  -> overnight settlement / grading

name: bullion-daily

on:
  schedule:
    - cron: "45 9 * * *"
    - cron: "15 14 * * *"
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "Lane key, 'soccer', or 'all'"
        required: false
        default: "all"
      date:
        description: "SAST day (YYYY-MM-DD). Empty = today."
        required: false
        default: ""
      as_of:
        description: "Decision-time UTC override (YYYY-MM-DDTHH:MM:SSZ). Empty = now."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bullion-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore SQLite warehouse
        uses: actions/cache@v4
        with:
          path: localdata/bullion.db
          key: bullion-db-${{ github.run_id }}
          restore-keys: |
            bullion-db-

      - name: Install project (no runtime dependencies)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Bounded backfill (only when the warehouse is cold)
        env:
          LEAGUE: ${{ inputs.league }}
        run: |
          if [ -f localdata/bullion.db ]; then
            echo "Warehouse cache restored; skipping backfill."
          else
            python3 scripts/backfill.py \
              --league "${LEAGUE:-all}" \
              --seasons 2024,2025,2026 \
              --max-events 250
          fi

      - name: Run daily lanes
        env:
          LEAGUE: ${{ inputs.league }}
          DAY: ${{ inputs.date }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          ARGS=(--league "${LEAGUE:-all}")
          if [ -n "${DAY}" ]; then ARGS+=(--date "${DAY}"); fi
          if [ -n "${AS_OF}" ]; then ARGS+=(--as-of "${AS_OF}"); fi
          python3 scripts/daily.py "${ARGS[@]}"

      - name: Replay parity gate
        run: python3 scripts/replay_harness.py --parity

      - name: Commit localdata artifacts (never the SQLite warehouse)
        run: |
          git config user.name "bullion-bot"
          git config user.email "bullion-bot@users.noreply.github.com"
          git add localdata
          if git diff --cached --quiet; then
            echo "No localdata changes to commit."
          else
            git commit -m "localdata: daily paper run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

# COPY THIS FILE TO .github/workflows/probe_espn.yml
#
# Arena's GitHub App token cannot push workflow files, so this file lives here
# for you to paste into `.github/workflows/probe_espn.yml` on GitHub.
#
# Purpose: capture REAL live ESPN payload facts for NHL, NFL, CFB, and the Top-6
# soccer lanes, then commit them so the parsers can be checked against evidence
# instead of assumptions. Run this FIRST, inspect the JSON, then enable daily.

name: probe-espn

on:
  workflow_dispatch:
    inputs:
      date:
        description: "SAST day to probe (YYYY-MM-DD). Empty = today."
        required: false
        default: ""
      leagues:
        description: "Lane keys comma list, 'soccer', or 'all'"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: bullion-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (no runtime dependencies)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Run live ESPN probe
        env:
          PROBE_DATE: ${{ inputs.date }}
          PROBE_LEAGUES: ${{ inputs.leagues }}
        run: |
          mkdir -p localdata/_probes
          ARGS=()
          if [ -n "${PROBE_DATE}" ]; then ARGS+=(--date "${PROBE_DATE}"); fi
          if [ -n "${PROBE_LEAGUES}" ]; then ARGS+=(--leagues "${PROBE_LEAGUES}"); fi
          python3 scripts/probe_espn.py \
            --out localdata/_probes/espn_probe_latest.json \
            --predictor-samples 3 \
            "${ARGS[@]}"

      - name: Show coverage summary
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open("localdata/_probes/espn_probe_latest.json"))
          print("captured_utc:", report["captured_utc"], "| sast_day:", report["sast_day"])
          for key, entry in report["leagues"].items():
              coverage = entry["coverage"]["named_book_pre_tip"]
              print(
                  f"{key:16s} events={entry['events']:4d} pre={entry['pre_events']:4d} "
                  f"offers={entry['odds_offers']:4d} "
                  + " ".join(f"{m}={coverage[m]['event_coverage']:.2f}" for m in coverage)
              )
          PY

      - name: Commit probe evidence
        run: |
          git config user.name "bullion-bot"
          git config user.email "bullion-bot@users.noreply.github.com"
          git add localdata/_probes/espn_probe_latest.json
          if git diff --cached --quiet; then
            echo "No probe changes to commit."
          else
            git commit -m "probe: live ESPN evidence $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
